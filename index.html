<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi calculadora chicle</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link href="index.css" rel="stylesheet">
    <script src="Calculadora.js" defer></script>
    <script src="Display.js" defer></script>
    <script src="index.js" defer></script>
</head>
<body>
    <div class="contenedor">
        <div class="calculadora">
            <h1>🍬 calculadora chicle</h1>

            <div class="display">
                <div id="arriba"></div>
                <div id="abajo">0</div>
                <div id="mensaje"></div>
            </div>

            <div class="botones">
                <button id="btn-c" class="col-2 rojo">C</button>
                <button id="btn-borrar" class="rojo">←</button>
                <button class="operador naranja" value="dividir">÷</button>

                <button class="numero">7</button>
                <button class="numero">8</button>
                <button class="numero">9</button>
                <button class="operador naranja" value="multiplicar">x</button>

                <button class="numero">4</button>
                <button class="numero">5</button>
                <button class="numero">6</button>
                <button class="operador naranja" value="restar">-</button>

                <button class="numero">1</button>
                <button class="numero">2</button>
                <button class="numero">3</button>
                <button class="operador naranja" value="sumar">+</button>

                <button class="col-2 numero">0</button>
                <button class="numero">.</button>
                <button class="operador verde" value="igual">=</button>
            </div>
        </div>
    </div>
</body>
</html>
